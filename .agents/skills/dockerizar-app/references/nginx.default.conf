# Nginx como front de una app SSR (producción / QA).
#
# Estrategia:
#   - Los estáticos compilados (/_nuxt/*, favicon, imágenes de /public) se
#     sirven directamente desde disco con cache agresiva (son inmutables,
#     llevan hash en el nombre).
#   - Todo lo demás (SSR de páginas + rutas /api) se hace proxy al servidor
#     de la app que corre en el contenedor "app" dentro de la red interna.
#
# "app" resuelve por DNS interno de Docker al contenedor del servidor.
# <<ADAPTAR>> el nombre del upstream y la ruta /_nuxt/ según tu framework.

upstream app_upstream {
    server app:3000;
    keepalive 32;
}

# Compresión para respuestas de texto.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Límite de subida (ajústalo según necesidades de la app).
    client_max_body_size 25m;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint de salud propio de nginx (no llega al backend).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Assets con hash: inmutables, cache de 1 año. Si no existe en disco,
    # se delega al backend (por si el servidor lo sirve dinámicamente).
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @backend;
    }

    # Resto de peticiones: intenta servir un fichero estático de /public;
    # si no existe (páginas SSR, /api, etc.), va al servidor de la app.
    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Soporte WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
